<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1565c0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="作業写真アプリ">
  <title>作業写真アプリ（LINE手動送付）</title>
  <link rel="manifest" href="manifest.webmanifest?v=20260530-2">
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=20260530-2">
  <link rel="stylesheet" href="css/style.css?v=20260530-2">
</head>
<body>
  <header class="app-header">
    <h1>作業写真アプリ</h1>
    <p class="subtitle">写真を確認して、人が送る</p>
  </header>

  <nav class="nav-tabs" role="tablist">
    <button type="button" class="nav-tab active" data-view="today" role="tab">今日 LINE で送る</button>
    <button type="button" class="nav-tab" data-view="jobs" role="tab">お客様一覧</button>
    <button type="button" class="nav-tab" data-view="data" role="tab" hidden>データ（開発者）</button>
  </nav>

  <div id="version-banner" class="version-banner" hidden></div>

  <main id="app-main" class="app-main" tabindex="-1"></main>

  <div id="save-toast" class="save-toast" hidden aria-live="polite"></div>

  <footer class="app-footer">
    <span id="footer-status">読み込み中…</span>
  </footer>

  <script>window.R1A_BUILD = "20260530-2";</script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./service-worker.js", { updateViaCache: "none" })
          .then((reg) => reg.update())
          .catch(() => {});
      });
    }
  </script>
  <script type="module" src="js/app.js?v=20260530-2"></script>
</body>
</html>
